# --- theoretical prior on shift-symmetric Horndeski -------------------
# Generated by `ssprior export --format cobaya`.
# Samples in the Gaussianised basis {X1..X4} of Eq. (23), where the
# theoretical prior is a multivariate normal, and maps back to the
# parameter names EFTCAMB expects.  'ref' and 'proposal' come from the
# fitted mu and sqrt(diag(Sigma)).
# X1..X4 are deliberately not 'drop'ped: ss_theory_prior requires them,
# and Cobaya never assigns a dropped parameter to a component.
params:
  X1:
    prior: {min: 0, max: 10}
    ref: {dist: norm, loc: 1.292119, scale: 0.462341}
    proposal: 0.462341
    latex: X_1
  X2:
    prior: {min: 0, max: 15}
    ref: {dist: norm, loc: 1.632171, scale: 0.275213}
    proposal: 0.275213
    latex: X_2
  X3:
    prior: {min: -10, max: 0}
    ref: {dist: norm, loc: -1.176279, scale: 0.040335}
    proposal: 0.040335
    latex: X_3
  X4:
    prior: {min: -15, max: 30}
    ref: {dist: norm, loc: -0.775016, scale: 0.137265}
    proposal: 0.137265
    latex: X_4
  Shift_Symmetric_alphaB0:
    value: 'lambda X1: X1'
    latex: \hat{\alpha}_{\rm B}
  Shift_Symmetric_m:
    value: 'lambda X1, X2: X2 / X1**(0.16666666666666666)'
    latex: m
  EFTw0:
    value: 'lambda X1, X2, X3: X3 / (X2 / X1**(0.16666666666666666))**(0.25)'
    latex: w_0
  EFTwa:
    value: 'lambda X1, X2, X4: X4 / (X2 / X1**(0.16666666666666666))**(2.0)'
    latex: w_a

likelihood:
  ss_theory_prior.SSTheoryPrior:
    python_path: /path/to/Theoretical_prior_Shift_Symmetric/cobaya_plugins
    prior_file: /path/to/Theoretical_prior_Shift_Symmetric/results/shift_symmetric_lambda0_prior.npz
    basis: X
